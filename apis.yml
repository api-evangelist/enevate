aid: enevate
name: Enevate
description: >-
  Enevate Corporation was an Irvine, California battery technology company that developed
  and licensed silicon-dominant lithium-ion anode and cell technology — marketed as
  HD-Energy and XFC-Energy — aimed at extreme fast charging (roughly five minutes to a
  substantial state of charge), high energy density, and cold-weather performance for
  electric vehicles, with a licensing rather than cell-manufacturing business model. It
  was a materials and cell-chemistry licensor, not a software vendor, and it never
  operated a developer program, public API, SDK or webhook surface. As of an August 2026
  probe the company's own domain no longer serves a company website: enevate.com redirects
  to a "Website Temporarily Unavailable" domain notice stating the prior Enevate
  Corporation website has been retired and the domain is now under new ownership following
  an asset acquisition process, and that all previously published statements about
  products, services, partnerships and company operations should no longer be considered
  current. This profile is retained as a recorded absence with the probe evidence attached.
